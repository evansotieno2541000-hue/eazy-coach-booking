<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eazy Coach Booking</title>
    <style>
        /* --- YOUR EXACT CSS --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(rgba(15, 23, 42, 0.3), rgba(15, 23, 42, 0.5)), 
                        url('bus-bg.jpg') center/cover no-repeat fixed;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top-Left Brand Header */
        .brand-header {
            padding: 25px 40px;
        }

        .brand-title {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -1px;
            text-decoration: none;
        }

        .brand-title .eazy {
            color: #ef4444; /* Red */
        }

        .brand-title .coach {
            color: #ffffff; /* White */
        }

        /* Multi-Column Main Layout */
        .main-wrapper {
            max-width: 1100px;
            margin: 20px auto 40px auto;
            padding: 0 20px;
            width: 100%;
            display: flex;
            gap: 40px;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
        }

        .booking-card {
            flex: 1.1;
            min-width: 320px;
            max-width: 500px;
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }

        .booking-card h3 {
            font-size: 22px;
            margin-bottom: 20px;
            color: #ffffff;
            border-bottom: 2px solid #334155;
            padding-bottom: 10px;
        }

        .form-step {
            margin-bottom: 20px;
        }

        .form-step label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input[type="date"], input[type="tel"] {
            width: 100%;
            padding: 12px 15px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }

        select:focus, input:focus {
            border-color: #38bdf8;
        }

        /* Interactive Seat Grid */
        .seat-section {
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .seat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .seat-header span {
            font-size: 14px;
            color: #38bdf8;
            font-weight: 700;
        }

        .bus-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
        }

        .seat {
            padding: 10px 0;
            background: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            font-size: 12px;
        }

        .seat:hover {
            background: #334155;
        }

        .seat.selected {
            background: #0284c7;
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        /* Fare Box */
        .fare-box {
            background: #092e42;
            border: 1px solid #0369a1;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .fare-box label {
            color: #93c5fd;
            font-size: 14px;
            margin: 0;
        }

        .fare-box span {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
        }

        .btn-pay {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #16a34a, #15803d);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3);
        }

        .btn-pay:hover {
            opacity: 0.9;
        }

        #status-msg {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #94a3b8;
            font-size: 13px;
            margin-top: auto;
            background: rgba(15, 23, 42, 0.5);
        }
    </style>
</head>
<body>

    <!-- Top-Left Branding -->
    <header class="brand-header">
        <div class="brand-title">
            <span class="eazy">eazy</span><span class="coach">coach</span>
        </div>
    </header>

    <div class="main-wrapper">
        <div class="booking-card">
            <h3>Book Your Seat</h3>
            
            <form id="bookingForm">
                <div class="form-step">
                    <label>Select Route</label>
                    <select id="routeSelect" required>
                        <option value="Nairobi - Kisumu" data-price="1200">Nairobi ➔ Kisumu (KES 1,200)</option>
                        <option value="Nairobi - Eldoret" data-price="1000">Nairobi ➔ Eldoret (KES 1,000)</option>
                        <option value="Nairobi - Mombasa" data-price="1500">Nairobi ➔ Mombasa (KES 1,500)</option>
                        <option value="Nairobi - Nakuru" data-price="600">Nairobi ➔ Nakuru (KES 600)</option>
                    </select>
                </div>

                <div class="form-step">
                    <label>Travel Date</label>
                    <input type="date" id="travelDate" required>
                </div>

                <div class="form-step">
                    <label>Choose Seat</label>
                    <div class="seat-section">
                        <div class="seat-header">
                            <span>Front Cabin</span>
                            <span id="selectedSeatText">No seat selected</span>
                        </div>
                        <div id="busGrid" class="bus-grid"></div>
                    </div>
                </div>

                <div class="form-step">
                    <label>M-Pesa Phone Number</label>
                    <input type="tel" id="phoneInput" placeholder="2547XXXXXXXX" required>
                </div>

                <div class="fare-box">
                    <label>Total Fare:</label>
                    <span id="totalFareDisplay">KES 1,200</span>
                </div>

                <button type="submit" id="payBtn" class="btn-pay">Pay via M-Pesa</button>
                <div id="status-msg"></div>
            </form>
        </div>
    </div>

    <footer>
        &copy; 2026 eazycoach Portal. All rights reserved.
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const busGrid = document.getElementById('busGrid');
            let selectedSeat = null;
            const rows = 10;
            const cols = ['A', 'B', 'C', 'D'];

            cols.forEach(col => {
                for (let r = 1; r <= rows; r++) {
                    const seatNum = `${r}${col}`;
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'seat';
                    btn.textContent = seatNum;
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.seat').forEach(s => s.classList.remove('selected'));
                        btn.classList.add('selected');
                        selectedSeat = seatNum;
                        document.getElementById('selectedSeatText').textContent = `Selected: ${seatNum}`;
                    });
                    busGrid.appendChild(btn);
                }
            });

            const routeSelect = document.getElementById('routeSelect');
            const totalFareDisplay = document.getElementById('totalFareDisplay');

            function updateFare() {
                const selectedOption = routeSelect.options[routeSelect.selectedIndex];
                const price = selectedOption.getAttribute('data-price');
                totalFareDisplay.textContent = `KES ${Number(price).toLocaleString()}`;
                return price;
            }

            routeSelect.addEventListener('change', updateFare);
            updateFare();

            const form = document.getElementById('bookingForm');
            const payBtn = document.getElementById('payBtn');
            const statusMsg = document.getElementById('status-msg');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                if (!selectedSeat) {
                    alert('Please select a seat before proceeding.');
                    return;
                }

                const phone = document.getElementById('phoneInput').value;
                const amount = updateFare();
                const route = routeSelect.value;
                const date = document.getElementById('travelDate').value;

                payBtn.textContent = 'Sending STK Push...';
                payBtn.disabled = true;
                statusMsg.style.color = '#38bdf8';
                statusMsg.textContent = 'Please check your phone for the M-Pesa prompt...';

                try {
                    const response = await fetch('http://localhost:3000/api/pay', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone, amount, route, seat: selectedSeat, date })
                    });

                    const data = await response.json();

                    if (data.success) {
                        statusMsg.style.color = '#16a34a';
                        statusMsg.textContent = 'STK Push sent successfully! Enter your PIN.';
                    } else {
                        statusMsg.style.color = '#ef4444';
                        statusMsg.textContent = data.error || 'Payment request failed.';
                    }
                } catch (err) {
                    console.error(err);
                    statusMsg.style.color = '#ef4444';
                    statusMsg.textContent = 'Connection error. Check your server.';
                } finally {
                    payBtn.textContent = 'Pay via M-Pesa';
                    payBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
